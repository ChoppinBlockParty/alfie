# Included first by Debian's /etc/ssh/sshd_config, and sshd takes the first value
# it sees for each keyword, so these win over the packaged defaults.

Port 2222
HostKey /etc/ssh/keys/ssh_host_ed25519_key

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
AllowUsers agent

# UsePAM no keeps sshd off the audit socket, so the container does not need
# CAP_AUDIT_WRITE. Key-only auth needs nothing PAM provides here.
UsePAM no

X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
PrintMotd no

# Left enabled deliberately: OpenSSH 9+ implements scp over the SFTP protocol, and
# Hermes' file_sync pushes credentials and skills with scp. Disabling the subsystem
# would break the sync with a message that looks nothing like a config mistake.
Subsystem sftp /usr/lib/openssh/sftp-server
